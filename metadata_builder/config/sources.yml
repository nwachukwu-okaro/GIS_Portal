    geographic_coverage: Great Britain
  a_os_codepoint:
    <<: *os_open_licence
    organisation: Ordnance Survey
    product: Code-Point Open
    source_url: https://www.ordnancesurvey.co.uk/products/code-point-open
    themes: [postcodes, addresses]
    geographic_coverage: Great Britain
  a_os_codepoint_polygon:
    organisation: Ordnance Survey
    product: Code-Point with Polygons
    source_url: https://www.ordnancesurvey.co.uk/products/codepoint-with-polygons
