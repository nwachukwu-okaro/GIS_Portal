# ============================================================
# Systra GIS Data Portal — docker-compose.yml
# ============================================================
# Three containers:
#
#   pycsw   — pycsw catalogue server (CSW + STAC endpoints)
#             Built from docker/Dockerfile
#             Internal port 8000, not exposed to the host
#
#   portal  — Django GIS Data Portal (search + upload UI)
#             Built from GIS_Portal/docker/Dockerfile
#             Internal port 8001, not exposed to the host
#
#   nginx   — Nginx reverse proxy
#             Exposed on port 80 (HTTP)
#             Routes requests to pycsw or portal based on URL path:
#               /csw  → pycsw:8000
#               /stac → pycsw:8000
#               /     → portal:8001 (everything else)
#
# External services (not containerised):
#   PostgreSQL/PostGIS — gisdb.systra.info:5432
#   MinIO              — gisdb.systra.info:9000
#
# Credentials are never embedded in this file.
# They come from the .env file via env_file directives.
# ============================================================

services:

  # ── pycsw catalogue server ──────────────────────────────────
  pycsw:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pycsw
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - PYCSW_CONFIG=/pycsw/config/pycsw.cfg
    volumes:
      - ../config/pycsw.cfg:/pycsw/config/pycsw.cfg:ro
      - ../scripts:/pycsw/scripts:ro
    networks:
      - catalogue-network
    healthcheck:
      test: >
        python -c "import urllib.request;
        urllib.request.urlopen('http://localhost:8000/csw?service=CSW&version=2.0.2&request=GetCapabilities')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Django GIS Data Portal ───────────────────────────────────
  portal:
    build:
      context: ../../GIS_Portal
      dockerfile: docker/Dockerfile
    container_name: portal
    restart: unless-stopped
    env_file:
      - ../../GIS_Portal/.env
    volumes:
      - portal_static:/app/staticfiles
    networks:
      - catalogue-network
    healthcheck:
      test: >
        python -c "import urllib.request;
        urllib.request.urlopen('http://localhost:8001/')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - pycsw

  # ── Nginx reverse proxy ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/pycsw.conf:/etc/nginx/conf.d/default.conf:ro
      - portal_static:/app/staticfiles:ro
    depends_on:
      - pycsw
      - portal
    networks:
      - catalogue-network

# ── Named volume for Django static files ─────────────────────
volumes:
  portal_static:

networks:
  catalogue-network:
    driver: bridge