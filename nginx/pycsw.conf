server {
    listen 80;
    server_name VLPUKBIRWRK01.systra.info;

    # CSW endpoint
    location /csw {
        proxy_pass         http://pycsw:8000/csw;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # STAC endpoint
    location /stac {
        proxy_pass         http://pycsw:8000/stac;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Root redirect to STAC
    location / {
        proxy_pass         http://pycsw:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}