# ============================================================
# Nginx configuration — Systra GIS Data Portal
# ============================================================
# Routes all incoming HTTP traffic on port 80 to the correct
# upstream container based on the URL path.
#
# Routing rules (evaluated in order):
#   /csw        → pycsw container (port 8000) — CSW endpoint
#   /stac       → pycsw container (port 8000) — STAC endpoint
#   /static/    → served directly by Nginx from the shared
#                 portal_static volume (no Python overhead)
#   /           → Django portal container (port 8001)
#
# The pycsw container handles both /csw and /stac. Django
# handles everything else including the search page, detail
# pages, upload forms, and the asset streaming view.
# ============================================================

server {
    listen 80;
    server_name VLPUKBIRWRK01.systra.info;

    # ── Client upload size ─────────────────────────────────────
    # Increased to 500MB to allow large GeoTIFF and LAS file uploads
    # through the Django upload form. Nginx will return 413 if this
    # limit is exceeded before Django ever sees the request.
    client_max_body_size 500M;

    # ── Timeouts ───────────────────────────────────────────────
    # Extended for large file uploads which may take several minutes.
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # ── Common proxy headers ───────────────────────────────────
    # Set once here and reused in each location block via include
    # (inline here for clarity since we only have one server block).

    # ── Django static files ────────────────────────────────────
    # Served directly by Nginx from the shared portal_static volume.
    # This bypasses Django entirely for CSS, images, and JS files,
    # which is significantly faster and reduces Gunicorn load.
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── pycsw CSW endpoint ─────────────────────────────────────
    # Passes /csw requests to the pycsw container.
    # QGIS MetaSearch connects to this URL.
    location /csw {
        proxy_pass         http://pycsw:8000/csw;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── pycsw STAC endpoint ────────────────────────────────────
    # Passes /stac requests to the pycsw container.
    location /stac {
        proxy_pass         http://pycsw:8000/stac;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Django portal — everything else ───────────────────────
    # The root location catches all requests not matched above
    # and passes them to the Django portal container.
    # This includes: / (search), /item/, /asset/, /upload/, /admin/
    location / {
        proxy_pass         http://portal:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # Required for Django CSRF to work correctly behind a proxy.
        # Without this, Django sees requests as HTTP even if the client
        # sent HTTPS, and CSRF validation may fail.
        proxy_set_header   X-Forwarded-Host  $host;
    }
}