    geographic_coverage: Great Britain
  a_os_open_rivers:
    <<: *os_open_licence
    organisation: Ordnance Survey
    product: OS Open Rivers
    source_url: https://www.ordnancesurvey.co.uk/products/os-open-rivers
    themes: [rivers, hydrography]
    geographic_coverage: Great Britain
  a_os_open_roads:
    <<: *os_open_licence
    organisation: Ordnance Survey
    product: OS Open Roads
    source_url: https://www.ordnancesurvey.co.uk/products/os-open-roads
    themes: [roads, transport]
    geographic_coverage: Great Britain
  a_os_open_terrain_50:
    <<: *os_open_licence
    organisation: Ordnance Survey
    product: OS Terrain 50
    source_url: https://www.ordnancesurvey.co.uk/products/os-terrain-50
    themes: [elevation, terrain]
    geographic_coverage: Great Britain
  a_os_zoomstack:
    <<: *os_open_licence
    organisation: Ordnance Survey
    product: OS Open Zoomstack
    source_url: https://www.ordnancesurvey.co.uk/products/os-open-zoomstack
    themes: [mapping, basemap]
    geographic_coverage: Great Britain
  a_overture_maps:
