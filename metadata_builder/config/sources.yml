    product: Overture Maps
    source_url: https://docs.overturemaps.org/
    themes: [mapping, places, transport]
    geographic_coverage: Global
  a_oxfordshire_county_council:
    organisation: Oxfordshire County Council
    source_url: https://insight.oxfordshire.gov.uk/cms/open-data
    themes: [local government, open data]
    geographic_coverage: Oxfordshire
  a_sport_england:
    organisation: Sport England
    product: Active Places
    source_url: https://www.sportengland.org/research-and-data/data/active-places
    themes: [sport, facilities]
    geographic_coverage: England
  a_sustrans:
    organisation: Sustrans
    source_url: https://data.sustrans.org.uk/
    themes: [active travel, cycling, walking]
    geographic_coverage: United Kingdom
  a_tfgm:
    organisation: Transport for Greater Manchester
    source_url: https://developer.tfgm.com/
